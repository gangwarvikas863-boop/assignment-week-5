<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body {
        font-family:poppins,sans-serif;
        background-color: #f2f2f2;
        color: #172554;
        font-size: 16px;
        line-height: 1.6;
        margin: 0;
        padding: 30;
    }
    .container {
        max-width: 1100px;
        margin: auto;
    }
    header {
        background-color: #315be8;
        color: white;
        text-align: white;
        padding: 20px;
        border-bottom: 15px;
        margin-bottom: 25px;
    }
    h1{
        font-size: 42px;
        font-weight: 700;
        line-height: 1.2;
        margin: 10px 0;
    }
    p{
        font-size: 18px;
        font-weight: 400;
        line-height: 1.6;
    }
    section{
        background-color: #f2f2f2;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 25px;

    }
    h2{
        color: #172554;
       font-size: 28px;
        font-weight:800;
        line-height: 1.3;
        margin-top: 5 px;
    }
    table{
        width: 100%;
        border-collapse: collapse;
        font-size: 16px;
        line-height: 1.6;
    
    }
    th{
        background-color: #315be8;
        color: white;
        font-weight: 600;
        padding: 10px;
        text-align: left;
    }
    td{
        border: 2px solid #ccc;
        padding: 15px;
        color: #333415;
    }
    label{
        font-size:16px;
        font-weight: 500;
        line-height:1.6;
    }
    input{
        font-family: poppins, sans-serif;
        font-size:15px;
        padding:12px;
        margin: 5px;
        border: 2px solid #cbd5e1;
        border-radius: 5px;
    }
  input:focus{
        outline: none;
        border-color: #315be8;
    }
    button{
        font-family: poppins, sans-serif;
        font-size: 16px;
        padding: 12px 24px;
        margin: 5px;
        background-color: #315be8;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover{
        background-color: #1e40af;
        }

</style>
</head>
<body>
<div class="container">
    <header>
        <h1>TECH CLUB</h1>
        <p>Learn, Code, Grow</p>
        </header>
        <section>
            <h2>
                Upcoming events
            </h2>
            <table>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Location</th>
                </tr>
                <tr>
                    <td>Hackathon</td>
                    <td>2023-10-15</td>
                    <td>Online</td>
                </tr>

                <tr>
                    <td>Workshop on AI</td>
                    <td>2023-11-05</td>
                    <td>Tech Club Lab</td>
                </tr>
            </table>
        </section>
        <section>
            <h2>Register</h2>
            <form>
                <label>Member Name:</label>
                <input type="text" placeholder="your name">

            <br>
                <label>Email:</label>
                <input type="email" placeholder="your email">
                <br>
                <button type="submit">Register</button>
            </form>
        </section>
    </div>
</body>
</html>
